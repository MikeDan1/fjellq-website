<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Seite nicht gefunden – FjellQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Diese Seite wurde nicht gefunden." />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preload" as="font" href="assets/noto-sans-miao.woff2" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body class="page-404">
  <div class="contours-parallax" aria-hidden="true">
    <div class="contours-bg"></div>
  </div>
  <div class="grain-overlay" aria-hidden="true"></div>

  <main class="error-main">
    <p class="error-code">404</p>
    <p class="error-title">Dieser Pfad führt ins Nichts.</p>
    <p class="error-description">Die gesuchte Seite existiert nicht oder wurde verschoben.</p>
    <a class="back" href="/">&larr; Zurück zur Startseite</a>
  </main>

  <script src="assets/contours-loader.js"></script>
  <script>
  (function () {
    var parallax = document.querySelector('.contours-parallax');
    if (!parallax || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var ticking = false;

    function update() {
      var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      parallax.style.transform = 'translateY(' + (-scrollTop * 0.04) + 'px)';
      ticking = false;
    }

    function onScroll() {
      if (!ticking) {
        window.requestAnimationFrame(update);
        ticking = true;
      }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    update();
  })();
  </script>
</body>
</html>
