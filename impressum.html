<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Impressum – FjellQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Impressum von FjellQ." />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

  <style>
    @font-face {
      font-family: 'Noto Sans Miao';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('assets/noto-sans-miao.woff2') format('woff2');
    }

    :root {
      --bg: #f5f5f4;
      --ink: #2b2b2b;
      --ink-muted: #6c6f71;
      --line: #d7d8d7;
      --line-soft: #e7e7e6;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #121313;
        --ink: #ececea;
        --ink-muted: #a3a5a3;
        --line: #2c2d2c;
        --line-soft: #1e1f1e;
      }
    }

    :root[data-theme="dark"] {
      --bg: #121313;
      --ink: #ececea;
      --ink-muted: #a3a5a3;
      --line: #2c2d2c;
      --line-soft: #1e1f1e;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Noto Sans Miao', -apple-system, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 6vh 6vw;
      overflow-x: hidden;
      transition: background 0.4s ease;
    }

    .contours-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      transform-origin: 50% 50%;
    }

    .contours-bg svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    @keyframes terrainBreathe {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.035); }
    }

    @keyframes driftIndex {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-34px, 22px); }
    }

    @keyframes driftMinor {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -28px); }
    }

    @media (prefers-reduced-motion: no-preference) {
      .contours-bg {
        animation: terrainBreathe 16s ease-in-out infinite;
      }

      .contours-bg .contour-index,
      .contours-bg .contour-label {
        animation: driftIndex 20s ease-in-out infinite;
      }

      .contours-bg .contour-minor {
        animation: driftMinor 26s ease-in-out infinite;
        animation-delay: -8s;
      }
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 32rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 0;
      color: var(--ink-muted);
    }

    address {
      font-style: normal;
      line-height: 1.7;
      font-size: 1rem;
    }

    a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.1em;
      transition: border-color 0.2s ease;
    }

    a:hover,
    a:focus-visible {
      border-color: var(--ink-muted);
    }

    .back {
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      color: var(--ink-muted);
      align-self: flex-start;
    }

    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="contours-bg" aria-hidden="true"></div>

  <main>
    <h1>Impressum</h1>
    <address>
      FjellQ<br />
      c/o Mike Danthine<br />
      Alte Seefeldstrasse 74<br />
      8616 Riedikon<br />
      <a href="mailto:hej@fjellq.ch">hej@fjellq.ch</a>
    </address>
    <a class="back" href="index.html">&larr; Zurück</a>
  </main>

  <script src="assets/contours-loader.js"></script>
</body>
</html>
